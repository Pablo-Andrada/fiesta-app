<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fiesta App · Jugá y competí</title>

<!--
  ================================================================
   FIESTA APP  ·  la sorpresita digital del cumple
  ================================================================
   QUE ES
   Una app de juegos para los invitados de un cumpleanos. Cada
   chico entra con el CODIGO DE FIESTA que viene en la tarjetita,
   elige un apodo y un avatar, y compite contra los demas en un
   ranking en vivo.

   NO PIDE datos personales, ni email, ni contrasena, ni fotos.
   Solo un apodo inventado y un emoji.

   ARCHIVOS
     index.html   <- este archivo (interfaz + juegos)
     ranking.js   <- conexion con la base de datos
     schema.sql   <- para crear las tablas en Supabase

   PARA ACTIVAR EL RANKING COMPARTIDO
     1) Crear el proyecto en supabase.com y correr schema.sql
     2) Poner la URL y la anon key arriba de ranking.js
   Si no se hace, la app igual funciona: guarda todo en el
   celular y el ranking muestra solo al jugador local.
  ================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">

<style>
/* ----------------------------------------------------------------
   PALETA · cambiar aca cambia toda la app
   ---------------------------------------------------------------- */
:root{
  --bg:#140a26; --bg2:#1d0d38; --panel:#241043; --panel2:#2e155a;
  --magenta:#ff2e9a; --cyan:#26e8ff; --violet:#b14bff; --yellow:#ffe14d; --lime:#8cff5a;
  --ink:#0a0416; --text:#fbeaff; --muted:#c9a9e8; --nav-h:66px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(177,75,255,.35), transparent 60%),
    radial-gradient(1000px 500px at 110% 8%, rgba(255,46,154,.28), transparent 55%),
    radial-gradient(900px 700px at 50% 120%, rgba(38,232,255,.20), transparent 55%),
    var(--bg);
  color:var(--text); font-family:"Baloo 2",system-ui,sans-serif; min-height:100vh;
  overflow-x:hidden; -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
body::before{ content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.06) 1.4px, transparent 1.6px); background-size:16px 16px; mix-blend-mode:screen; }

.app{ position:relative; z-index:1; max-width:640px; margin:0 auto; padding:20px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px); }
.tab{ display:none; animation:fade .25s ease } .tab.active{ display:block }
@keyframes fade{ from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }

/* ----------------------------------------------------------------
   PANTALLA DE ENTRADA (codigo de fiesta + apodo + avatar)
   ---------------------------------------------------------------- */
#entrada{ position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:20px;
  background:radial-gradient(900px 500px at 50% 0%, rgba(177,75,255,.35), transparent 60%), var(--bg); overflow-y:auto }
#entrada .caja{ width:min(420px,100%); text-align:center; padding:10px 0 30px }
#entrada h1{ font-family:"Bangers",cursive; font-size:clamp(38px,11vw,60px); line-height:.95; margin:6px 0 4px; color:#fff;
  text-shadow:2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink), 0 0 20px rgba(255,46,154,.8); transform:rotate(-1.5deg) }
#entrada .sub{ color:var(--muted); font-weight:600; margin-bottom:22px }
.paso{ display:none } .paso.on{ display:block }
.campo{ width:100%; font-family:"Baloo 2"; font-weight:800; font-size:20px; text-align:center; color:var(--text);
  background:var(--panel2); border:3px solid var(--ink); border-radius:16px; padding:14px; margin-bottom:12px; text-transform:uppercase }
.campo::placeholder{ color:#8b6bb0; font-weight:600 }
.campo.apodo{ text-transform:none }
.avatares{ display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin:6px 0 16px }
.av{ aspect-ratio:1/1; font-size:26px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  background:var(--panel2); border:3px solid var(--ink); border-radius:14px; transition:transform .12s }
.av.on{ border-color:var(--yellow); background:var(--violet); transform:scale(1.08) }
.aviso{ color:var(--magenta); font-weight:700; min-height:22px; margin-bottom:6px; font-size:14px }
.tip{ color:var(--muted); font-size:13px; margin-top:14px; line-height:1.4 }

/* ----------------------------------------------------------------
   ENCABEZADO Y SOLAPAS
   ---------------------------------------------------------------- */
.topbar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px }
.yo{ display:flex; align-items:center; gap:8px; background:var(--panel); border:3px solid var(--ink); border-radius:999px; padding:6px 14px 6px 8px; font-weight:800 }
.yo .ava{ font-size:22px } .yo .nom{ font-size:14px }
.chip{ font-size:11px; font-weight:800; padding:4px 10px; border-radius:999px; border:2px solid var(--ink) }
.chip.on{ background:var(--lime); color:var(--ink) } .chip.off{ background:var(--panel2); color:var(--muted) }

.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; justify-content:center; gap:4px;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom)); background:linear-gradient(0deg, rgba(10,4,22,.98), rgba(20,10,40,.9));
  border-top:2px solid rgba(177,75,255,.45); backdrop-filter:blur(8px) }
.tabbar button{ flex:1; max-width:130px; background:none; border:none; cursor:pointer; color:var(--muted); font-family:"Baloo 2"; font-weight:800; font-size:11px;
  display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 4px; border-radius:14px }
.tabbar button .ti{ font-size:22px; line-height:1; filter:grayscale(.4) brightness(.8) }
.tabbar button.active{ color:#fff; background:rgba(177,75,255,.18) } .tabbar button.active .ti{ filter:none }

.sec-title{ text-align:center; font-family:"Bangers",cursive; letter-spacing:1.5px; font-size:clamp(28px,8vw,42px); margin:12px 0 2px; color:var(--lime); text-shadow:2px 2px 0 var(--ink), 0 0 18px rgba(140,255,90,.55); transform:rotate(-1deg) }
.sec-sub{ text-align:center; color:var(--muted); font-weight:500; margin:0 0 16px }

/* ----------------------------------------------------------------
   JUEGOS · grilla de tarjetas
   ---------------------------------------------------------------- */
.games{ display:grid; grid-template-columns:1fr 1fr; gap:12px }
.gcard{ cursor:pointer; border:3px solid var(--ink); border-radius:18px; padding:16px 12px; text-align:center; color:var(--text);
  background:linear-gradient(160deg,var(--panel),var(--panel2)); box-shadow:5px 5px 0 rgba(10,4,22,.6); transition:transform .12s, box-shadow .12s; font-weight:800; position:relative }
.gcard:hover{ transform:translate(-2px,-2px); box-shadow:8px 8px 0 var(--magenta) }
.gcard .ic{ font-size:36px; display:block; margin-bottom:5px } .gcard .nm{ font-size:16px }
.gcard .best{ font-size:11px; color:var(--yellow); font-weight:800; margin-top:3px; min-height:14px }

/* ----------------------------------------------------------------
   RANKING
   ---------------------------------------------------------------- */
.filtros{ display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:12px }
.filtro{ flex:0 0 auto; font-family:"Baloo 2"; font-weight:800; font-size:13px; padding:7px 14px; border-radius:999px;
  border:3px solid var(--ink); background:var(--panel2); color:var(--muted); cursor:pointer }
.filtro.on{ background:var(--violet); color:#fff }
.rank-row{ display:flex; align-items:center; gap:12px; border:3px solid var(--ink); border-radius:16px; padding:10px 14px; margin-bottom:9px;
  background:linear-gradient(150deg,var(--panel),var(--panel2)); box-shadow:4px 4px 0 rgba(10,4,22,.5) }
.rank-row.yo{ border-color:var(--cyan); box-shadow:4px 4px 0 var(--cyan) }
.rank-row .pos{ font-family:"Bangers",cursive; font-size:24px; width:34px; text-align:center; color:var(--muted) }
.rank-row.top1 .pos{ color:#ffc400; font-size:28px } .rank-row.top2 .pos{ color:#d8d8e8 } .rank-row.top3 .pos{ color:#e08c4a }
.rank-row .ava{ font-size:28px } .rank-row .nom{ flex:1; font-weight:800; font-size:15px }
.rank-row .pts{ font-weight:800; color:var(--yellow); font-size:15px }
.vacio{ text-align:center; color:var(--muted); padding:26px 10px; font-weight:600 }

/* ----------------------------------------------------------------
   VENTANA EMERGENTE (donde se abren los juegos)
   ---------------------------------------------------------------- */
.modal{ position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; padding:16px; background:rgba(8,3,20,.85); backdrop-filter:blur(4px) } .modal.open{ display:flex }
.sheet{ width:min(460px,100%); max-height:92vh; overflow:auto; background:linear-gradient(180deg,var(--bg2),var(--panel)); border:3px solid var(--ink); border-radius:22px; padding:18px 16px 20px; box-shadow:0 0 40px rgba(177,75,255,.5) }
.sheet h2{ font-family:"Bangers",cursive; letter-spacing:1px; font-size:30px; margin:2px 0 2px; color:var(--cyan); text-shadow:0 0 14px rgba(38,232,255,.5) }
.sheet .lead{ color:var(--muted); font-weight:500; margin:0 0 12px; font-size:14px }
.close{ float:right; font-family:"Baloo 2"; font-weight:800; cursor:pointer; background:var(--magenta); color:#fff; border:3px solid var(--ink); width:40px; height:40px; border-radius:12px; font-size:20px }

.hud{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin:2px 0 8px; font-weight:800; font-size:14px }
.hud .lv{ background:var(--violet); color:#fff; border:2px solid var(--ink); border-radius:999px; padding:3px 12px; font-size:13px }
.banner{ text-align:center; font-family:"Bangers",cursive; font-size:26px; color:var(--lime); min-height:30px; margin:8px 0; text-shadow:0 0 12px rgba(140,255,90,.5) }
.btn{ font-family:"Baloo 2"; font-weight:800; cursor:pointer; background:var(--violet); color:#fff; border:3px solid var(--ink); padding:10px 18px; border-radius:14px; font-size:16px; box-shadow:3px 3px 0 var(--ink);
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:manipulation }
.btn:active{ transform:translate(1px,1px) } .btn.alt{ background:var(--cyan); color:var(--ink) } .btn.danger{ background:var(--magenta); color:#fff }
.stat{ font-weight:800; color:var(--yellow) }
.center{ text-align:center } .mt{ margin-top:14px }

/* --- estilos propios de cada juego (memoria, canvas, etc) --- */
.mem-grid{ display:grid; gap:8px; margin-top:6px }
.mem-card{ aspect-ratio:1/1; border-radius:12px; border:3px solid var(--ink); display:flex; align-items:center; justify-content:center; font-size:28px; cursor:pointer; background:linear-gradient(145deg,var(--panel2),var(--violet)); color:transparent; user-select:none; transition:transform .15s }
.mem-card.show{ background:var(--bg); color:#fff } .mem-card.done{ background:linear-gradient(145deg,#1c7a3a,var(--lime)); color:#fff; cursor:default }

#snakeCanvas,#autoCanvas,#basketCanvas,#naveCanvas{ display:block; margin:0 auto; background:var(--ink); border:3px solid var(--violet); border-radius:14px; touch-action:none }
#snakeCanvas{ width:min(300px,86vw); height:min(300px,86vw) }
#autoCanvas,#basketCanvas,#naveCanvas{ width:min(300px,84vw); height:min(380px,106vw) }
.dpad{ display:grid; grid-template-columns:repeat(3,56px); grid-template-rows:repeat(3,56px); gap:6px; justify-content:center; margin:14px auto 0 } .dpad .btn{ padding:0; font-size:22px; border-radius:12px; display:flex; align-items:center; justify-content:center } .dpad .sp{ visibility:hidden }
.lr{ display:flex; gap:12px; justify-content:center; margin-top:12px } .lr .btn{ font-size:24px; min-width:74px }

.ttt-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-width:260px; margin:8px auto }
.ttt-cell{ aspect-ratio:1/1; border:3px solid var(--ink); border-radius:14px; cursor:pointer; background:var(--panel2); display:flex; align-items:center; justify-content:center; font-size:44px } .ttt-cell:hover{ background:var(--panel) }

.tri-q{ font-weight:800; font-size:18px; margin:6px 0 12px; min-height:48px } .tri-opts{ display:grid; gap:10px }
.tri-opt{ text-align:left; font-family:"Baloo 2"; font-weight:700; font-size:15px; padding:12px 14px; border-radius:14px; border:3px solid var(--ink); cursor:pointer; background:var(--panel2); color:var(--text) }
.tri-opt:hover{ background:var(--panel) } .tri-opt.ok{ background:linear-gradient(145deg,#1c7a3a,var(--lime)); color:#fff } .tri-opt.no{ background:linear-gradient(145deg,#7a1c2e,var(--magenta)); color:#fff }



#confetti{ position:fixed; inset:0; pointer-events:none; z-index:90 }
@media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important } }
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<!-- ================================================================
     PANTALLA DE ENTRADA
     Paso 1: codigo de la fiesta · Paso 2: apodo y avatar
     ================================================================ -->
<div id="entrada">
  <div class="caja">
    <div style="font-size:52px">🎉</div>
    <h1 id="entTitulo">¡BIENVENIDO<br>A LA FIESTA!</h1>

    <!-- Paso 1 -->
    <div class="paso on" id="paso1">
      <p class="sub">Escribí el código que está en tu tarjetita</p>
      <input class="campo" id="inpCodigo" placeholder="CÓDIGO" maxlength="20" autocomplete="off">
      <div class="aviso" id="aviso1"></div>
      <button class="btn" id="btnCodigo" style="width:100%">Entrar ▶</button>
      <p class="tip">Si no tenés el código, pedíselo al cumpleañero 😉</p>
    </div>

    <!-- Paso 2 -->
    <div class="paso" id="paso2">
      <p class="sub">¿Cómo querés que te llamen?</p>
      <input class="campo apodo" id="inpApodo" placeholder="Tu apodo" maxlength="20" autocomplete="off">
      <p class="sub" style="margin:4px 0 6px">Elegí tu avatar</p>
      <div class="avatares" id="avatares"></div>
      <div class="aviso" id="aviso2"></div>
      <button class="btn alt" id="btnJugar" style="width:100%">¡A JUGAR! 🎮</button>
    </div>
  </div>
</div>

<!-- ================================================================
     APP PRINCIPAL
     ================================================================ -->
<div class="app" id="appMain" style="display:none">

  <div class="topbar">
    <div class="yo"><span class="ava" id="miAvatar">🙂</span><span class="nom" id="miApodo">—</span></div>
    <span class="chip off" id="chipConexion">local</span>
  </div>

  <!-- ===== JUEGOS ===== -->
  <section class="tab active" id="tab-juegos">
    <h2 class="sec-title">🕹️ JUEGOS</h2>
    <p class="sec-sub" id="subJuegos">Jugá y sumá puntos para el ranking</p>
    <div class="games" id="grillaJuegos"></div>
  </section>

  <!-- ===== RANKING ===== -->
  <section class="tab" id="tab-ranking">
    <h2 class="sec-title" style="color:var(--yellow);text-shadow:2px 2px 0 var(--ink),0 0 18px rgba(255,225,77,.55)">🏆 RANKING</h2>
    <p class="sec-sub">¿Quién va ganando la fiesta?</p>
    <div class="filtros" id="filtros"></div>
    <div id="listaRanking"><div class="vacio">Cargando…</div></div>
  </section>

</div>

<nav class="tabbar" id="tabbar" style="display:none">
  <button class="active" data-tab="juegos"><span class="ti">🕹️</span>Juegos</button>
  <button data-tab="ranking"><span class="ti">🏆</span>Ranking</button>
</nav>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="sheet"><button class="close" onclick="closeModal()">✕</button><div id="modalHost"></div></div>
</div>

<script src="ranking.js"></script>
<script>
/* ================================================================
   CONFIGURACION DE LOS JUEGOS DISPONIBLES
   Para sacar un juego, borra su linea. Para agregar uno nuevo,
   sumalo aca y despues defini su funcion mas abajo.
   ================================================================ */
const JUEGOS=[
  { id:'memoria', nombre:'Memoria',  icono:'🃏', fn:()=>Memoria },
  { id:'snake',   nombre:'Viborita', icono:'🐍', fn:()=>Snake },
  { id:'autos',   nombre:'Autitos',  icono:'🏎️', fn:()=>Autos },
  { id:'basquet', nombre:'Básquet',  icono:'🏀', fn:()=>Basquet },
  { id:'nave',    nombre:'Nave',     icono:'🚀', fn:()=>Nave },
  { id:'boxeo',   nombre:'Boxeo',    icono:'🥊', fn:()=>Boxeo },
  { id:'ttt',     nombre:'Ta-Te-Ti', icono:'⭕', fn:()=>Tateti },
  { id:'trivia',  nombre:'Trivia',   icono:'❓', fn:()=>Trivia },
];

const AVATARES=['🦁','🐯','🐸','🐼','🦊','🐵','🦄','🐲','🤖','👽','🦖','🐙','🦈','🐝','🦉','🐨','🍕','⚡'];

/* ================================================================
   PANTALLA DE ENTRADA
   ================================================================ */
let avatarElegido=AVATARES[0];

(function initEntrada(){
  const cont=document.getElementById('avatares');
  cont.innerHTML=AVATARES.map((a,i)=>`<div class="av ${i===0?'on':''}" data-av="${a}">${a}</div>`).join('');
  cont.querySelectorAll('.av').forEach(d=>d.onclick=()=>{
    cont.querySelectorAll('.av').forEach(x=>x.classList.remove('on'));
    d.classList.add('on'); avatarElegido=d.dataset.av;
  });

  // Si ya jugo antes en este celular, le precargamos los datos
  const ses=Fiesta.sesionGuardada();
  if(ses){
    document.getElementById('inpCodigo').value=ses.codigo||'';
    document.getElementById('inpApodo').value=ses.apodo||'';
  }
  // El codigo tambien puede venir en el link: ...index.html?f=LEON2026
  const enLink=new URLSearchParams(location.search).get('f');
  if(enLink) document.getElementById('inpCodigo').value=enLink.toUpperCase();

  document.getElementById('btnCodigo').onclick=validarCodigo;
  document.getElementById('inpCodigo').addEventListener('keydown',e=>{ if(e.key==='Enter') validarCodigo(); });
  document.getElementById('btnJugar').onclick=entrarAJugar;
  document.getElementById('inpApodo').addEventListener('keydown',e=>{ if(e.key==='Enter') entrarAJugar(); });
})();

async function validarCodigo(){
  const cod=document.getElementById('inpCodigo').value.trim();
  const aviso=document.getElementById('aviso1');
  if(!cod){ aviso.textContent='Escribí el código de la fiesta'; return; }
  aviso.textContent='Buscando…';
  const fiesta=await Fiesta.buscarFiesta(cod);
  if(!fiesta){ aviso.textContent='Ese código no existe o la fiesta ya terminó'; return; }
  aviso.textContent='';
  if(fiesta.festejado) document.getElementById('entTitulo').innerHTML='¡CUMPLE DE<br>'+fiesta.festejado.toUpperCase()+'!';
  document.getElementById('paso1').classList.remove('on');
  document.getElementById('paso2').classList.add('on');
  document.getElementById('inpApodo').focus();
}

async function entrarAJugar(){
  const apodo=document.getElementById('inpApodo').value.trim();
  const aviso=document.getElementById('aviso2');
  if(apodo.length<2){ aviso.textContent='Poné un apodo de al menos 2 letras'; return; }
  aviso.textContent='Entrando…';
  await Fiesta.entrar(apodo, avatarElegido);
  document.getElementById('entrada').style.display='none';
  document.getElementById('appMain').style.display='block';
  document.getElementById('tabbar').style.display='flex';
  document.getElementById('miApodo').textContent=apodo;
  document.getElementById('miAvatar').textContent=avatarElegido;
  const chip=document.getElementById('chipConexion');
  chip.textContent = Fiesta.estado.online ? 'en línea' : 'sin conexión';
  chip.className   = 'chip ' + (Fiesta.estado.online ? 'on' : 'off');
  if(Fiesta.estado.fiesta?.nombre) document.getElementById('subJuegos').textContent=Fiesta.estado.fiesta.nombre;
  renderJuegos(); burst(160);
}

/* ================================================================
   SOLAPA JUEGOS
   ================================================================ */
function renderJuegos(){
  const p=Fiesta.puntajesLocales();
  document.getElementById('grillaJuegos').innerHTML=JUEGOS.map(j=>{
    const b=p[j.id];
    return `<div class="gcard" onclick="openGame('${j.id}')">
      <span class="ic">${j.icono}</span><span class="nm">${j.nombre}</span>
      <div class="best">${b? 'Tu récord: '+b.puntos : ''}</div></div>`;
  }).join('');
}

/* ================================================================
   SOLAPA RANKING
   ================================================================ */
let filtroActual='global';
function renderFiltros(){
  const opciones=[{id:'global',nombre:'🌟 General'}].concat(JUEGOS.map(j=>({id:j.id,nombre:j.icono+' '+j.nombre})));
  document.getElementById('filtros').innerHTML=opciones.map(o=>
    `<button class="filtro ${o.id===filtroActual?'on':''}" onclick="cambiarFiltro('${o.id}')">${o.nombre}</button>`).join('');
}
function cambiarFiltro(id){ filtroActual=id; renderFiltros(); cargarRanking(); }

async function cargarRanking(){
  const cont=document.getElementById('listaRanking');
  cont.innerHTML='<div class="vacio">Cargando…</div>';
  const filas = filtroActual==='global'
    ? await Fiesta.rankingGlobal()
    : await Fiesta.rankingJuego(filtroActual);

  if(!filas.length){ cont.innerHTML='<div class="vacio">Todavía no jugó nadie.<br>¡Sé el primero! 🎮</div>'; return; }

  const medalla=i=>['🥇','🥈','🥉'][i]||('#'+(i+1));
  cont.innerHTML=filas.map((f,i)=>{
    const esYo=f.apodo===Fiesta.estado.apodo;
    return `<div class="rank-row ${i<3?'top'+(i+1):''} ${esYo?'yo':''}">
      <div class="pos">${medalla(i)}</div><div class="ava">${f.avatar}</div>
      <div class="nom">${f.apodo}${esYo?' (vos)':''}</div>
      <div class="pts">${f.puntos_totales} pts</div></div>`;
  }).join('') + (filas[0]?.soloLocal
    ? '<div class="vacio" style="font-size:13px">Sin conexión: se ve solo tu puntaje.<br>Cuando vuelva internet se compara con los demás.</div>' : '');
}

/* ================================================================
   NAVEGACION
   ================================================================ */
function showTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.id==='tab-'+name));
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  if(name==='ranking'){ renderFiltros(); cargarRanking(); }
  if(name==='juegos') renderJuegos();
  scrollTo({top:0,behavior:'smooth'});
}
document.querySelectorAll('.tabbar button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));

/* Ayudante de dibujo: rectangulos con esquinas redondeadas */
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

const MEM_EMOJIS=['🎂','🎈','🎁','🦁','🎮','🍔','🌟','🍕','🚗','🏀','🐶','🐱','🍦','🎸','⚽','🚀','🦖','🍩','🐢','🎯'];
const MEM_LEVELS=[ {pairs:8,cols:4}, {pairs:10,cols:5}, {pairs:12,cols:6}, {pairs:15,cols:6}, {pairs:18,cols:6} ];
function Memoria(el){
  let level=1;
  el.innerHTML=`<h2>🃏 Memoria</h2>
    <div class="hud"><span class="lv" id="mLv"></span><span>Jugadas: <span class="stat" id="mMoves">0</span></span>
      <button class="btn alt" id="mReset" style="padding:6px 12px;font-size:13px">Reiniciar</button></div>
    <div class="mem-grid" id="mGrid"></div><div class="banner" id="mBanner"></div>`;
  const grid=el.querySelector('#mGrid'), banner=el.querySelector('#mBanner');
  el.querySelector('#mReset').onclick=()=>{ level=1; build(); };
  let first,lock,pairs,moves,need,fs;
  function build(){
    const cfg=MEM_LEVELS[level-1];
    el.querySelector('#mLv').textContent='Nivel '+level+'/5'; el.querySelector('#mMoves').textContent='0';
    banner.textContent=''; first=null; lock=false; pairs=0; moves=0; need=cfg.pairs;
    fs = cfg.cols<=4?28:(cfg.cols===5?23:19);
    const pool=[...MEM_EMOJIS].sort(()=>Math.random()-0.5).slice(0,cfg.pairs);
    const deck=[...pool,...pool].sort(()=>Math.random()-0.5);
    grid.style.gridTemplateColumns=`repeat(${cfg.cols},1fr)`; grid.innerHTML='';
    deck.forEach(sym=>{ const c=document.createElement('div'); c.className='mem-card'; c.dataset.sym=sym; c.textContent=sym; c.style.fontSize=fs+'px'; c.onclick=()=>flip(c); grid.appendChild(c); });
  }
  function flip(c){
    if(lock||c.classList.contains('show')||c.classList.contains('done'))return;
    c.classList.add('show');
    if(!first){ first=c; return; }
    moves++; el.querySelector('#mMoves').textContent=moves;
    if(first.dataset.sym===c.dataset.sym){ first.classList.add('done'); c.classList.add('done'); first=null; pairs++; if(pairs===need) levelDone(); }
    else{ lock=true; const a=first,b=c; first=null; setTimeout(()=>{ a.classList.remove('show'); b.classList.remove('show'); lock=false; },700); }
  }
  function levelDone(){
    awardLevel('memoria', level); Fiesta.guardarPuntaje('memoria', level*100, level); burst();
    if(level<5){ banner.innerHTML=`¡Nivel ${level} listo! ⭐`;
      const b=document.createElement('button'); b.className='btn mt'; b.textContent='Siguiente nivel ▶'; b.onclick=()=>{ level++; build(); };
      banner.appendChild(document.createElement('br')); banner.appendChild(b);
    }else banner.innerHTML=`🏆 ¡Completaste la Memoria! 5 ⭐`;
  }
  build();
}

/* ============================================================
   VIBORITA · 5 niveles · traspasa paredes · (más lenta y fácil)
   ============================================================ */
const SNAKE_LEVELS=[
  { meta:14, speed:150, obst:2 },
  { meta:20, speed:135, obst:5 },
  { meta:26, speed:122, obst:8 },
  { meta:32, speed:110, obst:11 },
  { meta:40, speed:98,  obst:15 },
];
function Snake(el){
  el.innerHTML=`<h2>🐍 Viborita</h2>
    <p class="lead">Atravesás las paredes. Comé 🍎 y evitá tu cola y los bloques.</p>
    <div class="hud"><span class="lv" id="sLv"></span><span>🍎 <span class="stat" id="sMeta">0</span></span><span>Total: <span class="stat" id="sScore">0</span></span></div>
    <canvas id="snakeCanvas" width="300" height="300"></canvas>
    <div class="dpad"><span class="sp"></span><button class="btn" data-d="up">▲</button><span class="sp"></span>
      <button class="btn" data-d="left">◀</button><button class="btn alt" id="sPause">⏸</button><button class="btn" data-d="right">▶</button>
      <span class="sp"></span><button class="btn" data-d="down">▼</button><span class="sp"></span></div>
    <div class="banner" id="sBanner"></div>`;
  const cv=el.querySelector('#snakeCanvas'), ctx=cv.getContext('2d'); const N=15, S=cv.width/N;
  let level,metaCount,score,snake,dir,nextDir,food,obst,alive,paused,loop,done;
  function startLevel(l){
    level=l; const cfg=SNAKE_LEVELS[l-1];
    metaCount=0; snake=[{x:7,y:7}]; dir={x:1,y:0}; nextDir=dir; alive=true; paused=false; done=false;
    obst=genObst(cfg.obst); placeFood();
    el.querySelector('#sLv').textContent='Nivel '+l+'/5'; el.querySelector('#sMeta').textContent='0/'+cfg.meta; el.querySelector('#sBanner').textContent='';
    if(loop) clearInterval(loop); loop=setInterval(step,cfg.speed); draw();
  }
  function genObst(n){ const set=new Set(); let tries=0;
    while(set.size<n && tries<400){ tries++; const x=(Math.random()*N)|0, y=(Math.random()*N)|0;
      if(Math.abs(y-7)<=1) continue; if(x===7&&y===7) continue; set.add(x+','+y); } return set; }
  function placeFood(){ do{ food={x:(Math.random()*N)|0,y:(Math.random()*N)|0}; } while(snake.some(s=>s.x===food.x&&s.y===food.y) || obst.has(food.x+','+food.y)); }
  function step(){
    if(!alive||paused||done)return; dir=nextDir;
    let hx=(snake[0].x+dir.x+N)%N, hy=(snake[0].y+dir.y+N)%N; const head={x:hx,y:hy};
    if(snake.some(s=>s.x===hx&&s.y===hy) || obst.has(hx+','+hy)){ alive=false; el.querySelector('#sBanner').innerHTML=`<span style="color:var(--magenta)">¡Perdiste!</span>`; addRetry(); return; }
    snake.unshift(head);
    if(hx===food.x&&hy===food.y){
      score=(score||0)+1; metaCount++; el.querySelector('#sScore').textContent=score;
      const cfg=SNAKE_LEVELS[level-1]; el.querySelector('#sMeta').textContent=metaCount+'/'+cfg.meta;
      if(score>(Scores.data.snakeBest||0)){ Scores.data.snakeBest=score; Scores.save(); }
      if(metaCount>=cfg.meta){ levelUp(); return; } placeFood();
    }else snake.pop();
    draw();
  }
  function levelUp(){
    awardLevel('snake', level); Fiesta.guardarPuntaje('snake', score, level); burst();
    if(level<5){ done=true; if(loop) clearInterval(loop); const bn=el.querySelector('#sBanner'); bn.innerHTML=`¡Nivel ${level} superado! ⭐`;
      const b=document.createElement('button'); b.className='btn mt'; b.textContent='Nivel '+(level+1)+' ▶'; b.onclick=()=>startLevel(level+1);
      bn.appendChild(document.createElement('br')); bn.appendChild(b);
    }else{ done=true; if(loop) clearInterval(loop); el.querySelector('#sBanner').innerHTML=`🏆 ¡Ganaste la Viborita! 5 ⭐`; }
  }
  function addRetry(){ if(loop) clearInterval(loop); const bn=el.querySelector('#sBanner');
    const b=document.createElement('button'); b.className='btn alt mt'; b.textContent='Reintentar nivel'; b.onclick=()=>startLevel(level);
    bn.appendChild(document.createElement('br')); bn.appendChild(b); }
  function draw(){
    ctx.fillStyle='#0a0416'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#5b3a8a'; obst.forEach(k=>{ const [x,y]=k.split(',').map(Number); ctx.fillRect(x*S+1,y*S+1,S-2,S-2); });
    ctx.fillStyle='#ff2e9a'; ctx.fillRect(food.x*S+2,food.y*S+2,S-4,S-4);
    snake.forEach((s,i)=>{ ctx.fillStyle=i===0?'#8cff5a':'#26e8ff'; ctx.fillRect(s.x*S+1,s.y*S+1,S-2,S-2); });
  }
  function setDir(d){ const m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[d]; if(!m)return; if(m.x===-dir.x&&m.y===-dir.y)return; nextDir=m; }
  function key(e){ const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'}; if(map[e.key]){ e.preventDefault(); setDir(map[e.key]); } }
  el.querySelectorAll('.dpad [data-d]').forEach(b=>b.onclick=()=>setDir(b.dataset.d));
  el.querySelector('#sPause').onclick=()=>{ if(!alive||done)return; paused=!paused; el.querySelector('#sPause').textContent=paused?'▶':'⏸'; };
  let tx,ty;
  cv.addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;},{passive:true});
  cv.addEventListener('touchend',e=>{ const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty; if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?'right':'left'); else setDir(dy>0?'down':'up'); },{passive:true});
  document.addEventListener('keydown',key);
  score=0; el.querySelector('#sScore').textContent='0'; startLevel(1);
  cleanup=()=>{ if(loop) clearInterval(loop); document.removeEventListener('keydown',key); };
}

/* ============================================================
   AUTITOS · vista DESDE ARRIBA · 5 niveles (más fácil)
   ============================================================ */
const AUTO_LEVELS=[
  { meta:18, speed:2.4, spawn:1000 },
  { meta:26, speed:3.0, spawn:850 },
  { meta:34, speed:3.6, spawn:720 },
  { meta:42, speed:4.3, spawn:610 },
  { meta:52, speed:5.1, spawn:520 },
];
function Autos(el){
  el.innerHTML=`<h2>🏎️ Autitos</h2>
    <p class="lead">Vista desde arriba. Esquivá los autos cambiando de carril.</p>
    <div class="hud"><span class="lv" id="aLv"></span><span>Esquivados: <span class="stat" id="aMeta">0</span></span></div>
    <canvas id="autoCanvas" width="300" height="380"></canvas>
    <div class="lr"><button class="btn" id="aL">◀</button><button class="btn" id="aR">▶</button></div>
    <div class="banner" id="aBanner"></div>`;
  const cv=el.querySelector('#autoCanvas'), ctx=cv.getContext('2d');
  const W=cv.width, H=cv.height, LANES=[50,150,250], playerY=H-52;
  const COLORS=['#ff2e9a','#b14bff','#ffe14d','#ff7a1a','#8cff5a'];
  let level,lane,cars,dodged,alive,done,speed,spawnMs,spawnT,raf,last,roadOff=0;
  function startLevel(l){
    level=l; const cfg=AUTO_LEVELS[l-1];
    lane=1; cars=[]; dodged=0; alive=true; done=false; speed=cfg.speed; spawnMs=cfg.spawn; spawnT=0; last=performance.now();
    el.querySelector('#aLv').textContent='Nivel '+l+'/5'; el.querySelector('#aMeta').textContent='0/'+cfg.meta; el.querySelector('#aBanner').textContent='';
    if(raf) cancelAnimationFrame(raf); raf=requestAnimationFrame(frame);
  }
  function frame(now){
    const dt=Math.min(50, now-last); last=now;
    if(alive && !done){
      spawnT+=dt; if(spawnT>=spawnMs){ spawnT=0; spawnCar(); }
      const cfg=AUTO_LEVELS[level-1];
      for(let i=cars.length-1;i>=0;i--){ const c=cars[i]; c.y+=speed*(dt/16.7);
        if(c.lane===lane && Math.abs(c.y-playerY)<36){ crash(); return; }
        if(c.y>H+34){ cars.splice(i,1); dodged++; el.querySelector('#aMeta').textContent=dodged+'/'+cfg.meta; if(dodged>=cfg.meta){ levelUp(); return; } } }
    }
    draw(); raf=requestAnimationFrame(frame);
  }
  function spawnCar(){ const ln=(Math.random()*3)|0; if(cars.some(c=>c.lane===ln && c.y<60)) return; cars.push({ lane:ln, y:-40, color:COLORS[(Math.random()*COLORS.length)|0] }); }
  function carDraw(cx,cy,color,isPlayer){
    const w=44,h=72, top=cy-h/2, dir=isPlayer?-1:1;   // dir: -1 mira arriba, 1 mira abajo
    // sombra
    ctx.fillStyle='rgba(0,0,0,.35)'; rr(ctx,cx-w/2+3,top+5,w,h,11); ctx.fill();
    // ruedas
    ctx.fillStyle='#15121c';
    rr(ctx,cx-w/2-3,top+11,7,16,3); ctx.fill();  rr(ctx,cx+w/2-4,top+11,7,16,3); ctx.fill();
    rr(ctx,cx-w/2-3,top+h-27,7,16,3); ctx.fill(); rr(ctx,cx+w/2-4,top+h-27,7,16,3); ctx.fill();
    // carrocería
    ctx.fillStyle=color; rr(ctx,cx-w/2,top,w,h,11); ctx.fill();
    // brillo lateral
    ctx.fillStyle='rgba(255,255,255,.18)'; rr(ctx,cx-w/2+3,top+6,6,h-12,3); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.14)';       rr(ctx,cx+w/2-9,top+6,6,h-12,3); ctx.fill();
    // techo / cabina
    ctx.fillStyle='rgba(10,4,22,.35)'; rr(ctx,cx-w/2+6,top+24,w-12,26,6); ctx.fill();
    // parabrisas (adelante según dirección) y luneta
    const frontY = dir===-1 ? top+13 : top+h-25;
    const backY  = dir===-1 ? top+h-25 : top+13;
    ctx.fillStyle='#9fd8ff'; rr(ctx,cx-w/2+7,frontY,w-14,13,4); ctx.fill();
    ctx.fillStyle='rgba(159,216,255,.55)'; rr(ctx,cx-w/2+8,backY,w-16,11,4); ctx.fill();
    // espejos
    ctx.fillStyle=color; const my = dir===-1 ? top+26 : top+h-32;
    rr(ctx,cx-w/2-4,my,5,7,2); ctx.fill(); rr(ctx,cx+w/2-1,my,5,7,2); ctx.fill();
    // faros / luces traseras
    const lightY = dir===-1 ? top+3 : top+h-8;
    ctx.fillStyle= isPlayer? '#fff6c9' : '#ffe9a8';
    rr(ctx,cx-w/2+7,lightY,10,5,2); ctx.fill(); rr(ctx,cx+w/2-17,lightY,10,5,2); ctx.fill();
    const tailY = dir===-1 ? top+h-8 : top+3;
    ctx.fillStyle='#ff3b3b'; rr(ctx,cx-w/2+7,tailY,10,5,2); ctx.fill(); rr(ctx,cx+w/2-17,tailY,10,5,2); ctx.fill();
    // franja central del jugador
    if(isPlayer){ ctx.fillStyle='rgba(255,255,255,.55)'; rr(ctx,cx-3,top+6,6,14,2); ctx.fill(); rr(ctx,cx-3,top+h-20,6,14,2); ctx.fill(); }
  }
  function draw(){
    ctx.fillStyle='#191026'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#0a0416'; ctx.fillRect(0,0,6,H); ctx.fillRect(W-6,0,6,H);
    roadOff=(roadOff+speed*2)%40; ctx.strokeStyle='rgba(255,225,77,.5)'; ctx.lineWidth=4; ctx.setLineDash([20,20]); ctx.lineDashOffset=-roadOff;
    [100,200].forEach(x=>{ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }); ctx.setLineDash([]);
    cars.forEach(c=>carDraw(LANES[c.lane], c.y, c.color, false));
    carDraw(LANES[lane], playerY, '#26e8ff', true);
  }
  function crash(){ alive=false; el.querySelector('#aBanner').innerHTML=`<span style="color:var(--magenta)">¡Chocaste! 💥</span>`; addRetry(); }
  function levelUp(){ awardLevel('autos', level); Fiesta.guardarPuntaje('autos', dodged + (level-1)*50, level); burst(); done=true; const bn=el.querySelector('#aBanner');
    if(level<5){ bn.innerHTML=`¡Nivel ${level} superado! ⭐`; const b=document.createElement('button'); b.className='btn mt'; b.textContent='Nivel '+(level+1)+' ▶'; b.onclick=()=>startLevel(level+1); bn.appendChild(document.createElement('br')); bn.appendChild(b); }
    else bn.innerHTML=`🏆 ¡Ganaste los Autitos! 5 ⭐`; }
  function addRetry(){ const bn=el.querySelector('#aBanner'); const b=document.createElement('button'); b.className='btn alt mt'; b.textContent='Reintentar nivel'; b.onclick=()=>startLevel(level); bn.appendChild(document.createElement('br')); bn.appendChild(b); }
  function move(d){ if(!alive||done)return; lane=Math.max(0,Math.min(2,lane+d)); }
  el.querySelector('#aL').onclick=()=>move(-1); el.querySelector('#aR').onclick=()=>move(1);
  function key(e){ if(e.key==='ArrowLeft'||e.key==='a'){e.preventDefault();move(-1);} if(e.key==='ArrowRight'||e.key==='d'){e.preventDefault();move(1);} }
  document.addEventListener('keydown',key);
  cv.addEventListener('pointerdown',e=>{ const r=cv.getBoundingClientRect(); move((e.clientX-r.left)<r.width/2?-1:1); });
  startLevel(1);
  cleanup=()=>{ if(raf) cancelAnimationFrame(raf); document.removeEventListener('keydown',key); };
}

/* ============================================================
   BÁSQUET · 5 niveles · aro más grande
   ============================================================ */
const BASKET_LEVELS=[ { meta:5, move:0 }, { meta:7, move:1.2 }, { meta:9, move:1.9 }, { meta:11, move:2.7 }, { meta:13, move:3.5 } ];
function Basquet(el){
  el.innerHTML=`<h2>🏀 Básquet</h2>
    <p class="lead">Arrastrá la pelota hacia atrás y soltá para lanzar al aro.</p>
    <div class="hud"><span class="lv" id="bLv"></span><span>Encestes: <span class="stat" id="bMeta">0</span></span></div>
    <canvas id="basketCanvas" width="300" height="380"></canvas><div class="banner" id="bBanner"></div>`;
  const cv=el.querySelector('#basketCanvas'), ctx=cv.getContext('2d');
  const W=cv.width, H=cv.height, G=0.24, K=0.16; const baseX=W/2, baseY=H-30, R=15, RIM=26; // aro más grande
  let level,made,ball,hoop,drag,aim,done,raf,prevY;
  function startLevel(l){
    level=l; const cfg=BASKET_LEVELS[l-1]; made=0; done=false; drag=false; aim=null;
    ball={x:baseX,y:baseY,vx:0,vy:0,flying:false}; prevY=baseY; hoop={x:W/2+50,y:96,dir:1,move:cfg.move};
    el.querySelector('#bLv').textContent='Nivel '+l+'/5'; el.querySelector('#bMeta').textContent='0/'+cfg.meta; el.querySelector('#bBanner').textContent='';
    if(raf) cancelAnimationFrame(raf); raf=requestAnimationFrame(frame);
  }
  function resetBall(){ ball={x:baseX,y:baseY,vx:0,vy:0,flying:false}; prevY=baseY; }
  function frame(){
    if(hoop.move>0 && !done){ hoop.x+=hoop.move*hoop.dir; if(hoop.x>W-50){ hoop.x=W-50; hoop.dir=-1; } if(hoop.x<50){ hoop.x=50; hoop.dir=1; } }
    if(ball.flying){ prevY=ball.y; ball.x+=ball.vx; ball.y+=ball.vy; ball.vy+=G;
      if(ball.vy>0 && prevY<hoop.y && ball.y>=hoop.y && Math.abs(ball.x-hoop.x)<RIM){ scored(); }
      else if(ball.y>H+40 || ball.x<-40 || ball.x>W+40){ resetBall(); } }
    draw(); raf=requestAnimationFrame(frame);
  }
  function scored(){ made++; const cfg=BASKET_LEVELS[level-1]; el.querySelector('#bMeta').textContent=made+'/'+cfg.meta; resetBall(); if(made>=cfg.meta) levelUp(); else burst(40); }
  function levelUp(){ awardLevel('basquet', level); Fiesta.guardarPuntaje('basquet', level*100, level); burst(); done=true; const bn=el.querySelector('#bBanner');
    if(level<5){ bn.innerHTML=`¡Nivel ${level} superado! ⭐`; const b=document.createElement('button'); b.className='btn mt'; b.textContent='Nivel '+(level+1)+' ▶'; b.onclick=()=>startLevel(level+1); bn.appendChild(document.createElement('br')); bn.appendChild(b); }
    else bn.innerHTML=`🏆 ¡Ganaste el Básquet! 5 ⭐`; }
  function draw(){
    ctx.fillStyle='#0a0416'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e7dcff'; ctx.fillRect(hoop.x-2, hoop.y-42, 4, 36); ctx.strokeStyle='#e7dcff'; ctx.lineWidth=3; ctx.strokeRect(hoop.x-32, hoop.y-42, 64, 32);
    ctx.strokeStyle='#ff7a1a'; ctx.lineWidth=4; ctx.beginPath(); ctx.ellipse(hoop.x, hoop.y, RIM, 7, 0, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1; for(let i=-3;i<=3;i++){ ctx.beginPath(); ctx.moveTo(hoop.x+i*8, hoop.y+4); ctx.lineTo(hoop.x+i*4, hoop.y+22); ctx.stroke(); }
    if(drag && aim){ ctx.strokeStyle='rgba(38,232,255,.8)'; ctx.setLineDash([6,6]); ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(ball.x,ball.y); ctx.lineTo(2*ball.x-aim.x, 2*ball.y-aim.y); ctx.stroke(); ctx.setLineDash([]); }
    ctx.font=(R*2)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('🏀', ball.x, ball.y);
  }
  function pos(e){ const r=cv.getBoundingClientRect(); return { x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height) }; }
  cv.addEventListener('pointerdown',e=>{ if(done||ball.flying)return; const p=pos(e); if(Math.hypot(p.x-ball.x,p.y-ball.y)<60){ drag=true; aim=p; } });
  cv.addEventListener('pointermove',e=>{ if(drag){ aim=pos(e); } });
  cv.addEventListener('pointerup',e=>{ if(!drag)return; drag=false; const p=pos(e); ball.vx=(ball.x-p.x)*K; ball.vy=(ball.y-p.y)*K; ball.flying=true; aim=null; });
  cv.addEventListener('pointerleave',()=>{ if(drag){ drag=false; aim=null; } });
  startLevel(1);
  cleanup=()=>{ if(raf) cancelAnimationFrame(raf); };
}

/* ============================================================
   NAVE · shooter espacial (tipo Galaga) · 5 niveles
   ============================================================ */
/* Colores de los extraterrestres por nivel: 1 azul · 2 naranja · 3 rojo · 4 verde · 5 blanco */
const ALIEN_COLORS=['#3b82f6','#ff8c1a','#ff2e3f','#8cff5a','#ffffff'];
const NAVE_LEVELS=[
  { meta:24, espd:1.4, spawn:900 },
  { meta:36, espd:1.8, spawn:780 },
  { meta:48, espd:2.2, spawn:670 },
  { meta:60, espd:2.7, spawn:570 },
  { meta:72, espd:3.3, spawn:480 },
];
function Nave(el){
  el.innerHTML=`<h2>🚀 Nave</h2>
    <p class="lead">Movete con ◀ ▶ y disparale a los extraterrestres con 🔥</p>
    <div class="hud"><span class="lv" id="nLv"></span><span id="nLives">❤️❤️❤️</span><span>👾 <span class="stat" id="nMeta">0</span></span></div>
    <canvas id="naveCanvas" width="300" height="380"></canvas>
    <div class="lr"><button class="btn" id="nL">◀</button><button class="btn danger" id="nFire">🔥</button><button class="btn" id="nR">▶</button></div>
    <div class="banner" id="nBanner"></div>`;
  const cv=el.querySelector('#naveCanvas'), ctx=cv.getContext('2d'); const W=cv.width, H=cv.height, shipY=H-34;
  const stars=Array.from({length:40},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+0.5}));
  let level,kills,lives,shipX,bullets,enemies,alive,done,raf,last,spawnT,lastShot,moveL,moveR,firing;
  function startLevel(l){
    level=l; const cfg=NAVE_LEVELS[l-1];
    kills=0; lives=3; shipX=W/2; bullets=[]; enemies=[]; alive=true; done=false; spawnT=0; lastShot=0; last=performance.now(); moveL=moveR=firing=false;
    el.querySelector('#nLv').textContent='Nivel '+l+'/5'; el.querySelector('#nMeta').textContent='0/'+cfg.meta; el.querySelector('#nLives').textContent='❤️❤️❤️'; el.querySelector('#nBanner').textContent='';
    if(raf) cancelAnimationFrame(raf); raf=requestAnimationFrame(frame);
  }
  function loseLife(){ lives--; el.querySelector('#nLives').textContent='❤️'.repeat(Math.max(0,lives))||'💀'; if(lives<=0){ gameOver(); } }
  function gameOver(){ alive=false; el.querySelector('#nBanner').innerHTML=`<span style="color:var(--magenta)">¡Te alcanzaron! 👾</span>`; const bn=el.querySelector('#nBanner'); const b=document.createElement('button'); b.className='btn alt mt'; b.textContent='Reintentar nivel'; b.onclick=()=>startLevel(level); bn.appendChild(document.createElement('br')); bn.appendChild(b); }
  function frame(now){
    const dt=Math.min(50, now-last); last=now;
    if(alive && !done){
      const cfg=NAVE_LEVELS[level-1];
      if(moveL) shipX-=4.2; if(moveR) shipX+=4.2; shipX=Math.max(20,Math.min(W-20,shipX));
      if(firing && now-lastShot>240){ bullets.push({x:shipX,y:shipY-16}); lastShot=now; }
      bullets.forEach(b=>b.y-=6); bullets=bullets.filter(b=>b.y>-10);
      spawnT+=dt; if(spawnT>=cfg.spawn){ spawnT=0; enemies.push({x:20+Math.random()*(W-40), y:-16, ph:Math.random()*100}); }
      for(let i=enemies.length-1;i>=0;i--){ const en=enemies[i]; en.y+=cfg.espd*(dt/16.7); en.x+=Math.sin((en.y+en.ph)/28)*1.1;
        if(Math.hypot(en.x-shipX, en.y-shipY)<19){ enemies.splice(i,1); loseLife(); if(!alive) return; continue; }
        if(en.y>H+16){ enemies.splice(i,1); continue; }   // si escapa por abajo NO penaliza
        let hit=false;
        for(let j=bullets.length-1;j>=0;j--){ if(Math.abs(bullets[j].x-en.x)<16 && Math.abs(bullets[j].y-en.y)<18){ bullets.splice(j,1); hit=true; break; } }
        if(hit){ enemies.splice(i,1); kills++; el.querySelector('#nMeta').textContent=kills+'/'+cfg.meta; if(kills>=cfg.meta){ levelUp(); return; } }
      }
    }
    draw(); raf=requestAnimationFrame(frame);
  }
  function levelUp(){ awardLevel('nave', level); Fiesta.guardarPuntaje('nave', kills + (level-1)*80, level); burst(); done=true; const bn=el.querySelector('#nBanner');
    if(level<5){ bn.innerHTML=`¡Nivel ${level} superado! ⭐`; const b=document.createElement('button'); b.className='btn mt'; b.textContent='Nivel '+(level+1)+' ▶'; b.onclick=()=>startLevel(level+1); bn.appendChild(document.createElement('br')); bn.appendChild(b); }
    else bn.innerHTML=`🏆 ¡Ganaste la Nave! 5 ⭐`; }
  function draw(){
    ctx.fillStyle='#05030f'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,.7)'; stars.forEach(st=>{ st.y+=0.6; if(st.y>H){ st.y=0; st.x=Math.random()*W; } ctx.fillRect(st.x,st.y,st.s,st.s); });
    ctx.fillStyle='#ffe14d'; bullets.forEach(b=>ctx.fillRect(b.x-2,b.y-8,4,10));
    const alienCol=ALIEN_COLORS[Math.min(4,level-1)];
    enemies.forEach(en=>{
      const x=en.x, y=en.y;
      ctx.fillStyle=alienCol;
      ctx.fillRect(x-11,y-7,22,12);                                  // cuerpo
      ctx.fillRect(x-7,y-12,14,5);                                   // cabeza
      ctx.fillRect(x-15,y-3,4,7); ctx.fillRect(x+11,y-3,4,7);        // brazos
      ctx.fillRect(x-9,y+5,5,5);  ctx.fillRect(x+4,y+5,5,5);         // patas
      ctx.fillStyle='#0a0416';
      ctx.fillRect(x-6,y-5,4,4);  ctx.fillRect(x+2,y-5,4,4);         // ojos
    });
    ctx.save(); ctx.translate(shipX,shipY); ctx.rotate(-Math.PI/4); ctx.font='30px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('🚀',0,0); ctx.restore();
  }
  const bind=(id,set)=>{ const b=el.querySelector(id); b.addEventListener('contextmenu',e=>e.preventDefault()); b.addEventListener('pointerdown',e=>{e.preventDefault(); set(true);}); ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>set(false))); };
  bind('#nL',v=>moveL=v); bind('#nR',v=>moveR=v); bind('#nFire',v=>firing=v);
  function kd(e){ if(e.key==='ArrowLeft'||e.key==='a'){moveL=true;} if(e.key==='ArrowRight'||e.key==='d'){moveR=true;} if(e.key===' '){e.preventDefault();firing=true;} }
  function ku(e){ if(e.key==='ArrowLeft'||e.key==='a'){moveL=false;} if(e.key==='ArrowRight'||e.key==='d'){moveR=false;} if(e.key===' '){firing=false;} }
  document.addEventListener('keydown',kd); document.addEventListener('keyup',ku);
  startLevel(1);
  cleanup=()=>{ if(raf) cancelAnimationFrame(raf); document.removeEventListener('keydown',kd); document.removeEventListener('keyup',ku); };
}

/* ============================================================
   BOXEO · 5 rounds · luchadores propios (sin imagenes externas)
   ------------------------------------------------------------
   Cada luchador es un personaje generico dibujado con formas
   + un emoji como cara. No usa imagenes: asi la app pesa poco,
   carga al instante y no depende de archivos externos.

   Ademas de moverse a los costados, cada boxeador tiene una
   "profundidad" (variable z): 0 es el fondo del ring y 1 el
   frente. Un golpe solo pega si estan cerca TAMBIEN en z,
   asi que moverse en profundidad sirve para esquivar.
   ============================================================ */
const BOX_PERSONAJES=[
  { id:'tigre',  nombre:'El Tigre',   emoji:'🐯', trunk:'#ff8c1a' },
  { id:'rayo',   nombre:'Rayo Veloz', emoji:'⚡', trunk:'#ffe14d' },
  { id:'roca',   nombre:'La Roca',    emoji:'🗿', trunk:'#8aa0c8' },
  { id:'ninja',  nombre:'Ninja',      emoji:'🥷', trunk:'#26e8ff' },
  { id:'robot',  nombre:'Robotron',   emoji:'🤖', trunk:'#8cff5a' },
  { id:'dragon', nombre:'Dragón',     emoji:'🐲', trunk:'#ff2e9a' },
];
const BOX_LEVELS=[
  { hp:120, dmg:7,  intv:1500, spd:0.9, block:0.20, ret:0.10 },
  { hp:155, dmg:9,  intv:1330, spd:1.1, block:0.32, ret:0.20 },
  { hp:195, dmg:12, intv:1160, spd:1.3, block:0.44, ret:0.30 },
  { hp:240, dmg:15, intv:1010, spd:1.5, block:0.55, ret:0.42 },
  { hp:290, dmg:18, intv:880,  spd:1.7, block:0.65, ret:0.55 },
];
const boxImgs={};
function loadFace(p){ return { ok:false, emoji:p.emoji }; }  // sin imágenes: usamos emojis propios

function Boxeo(el){
  BOX_PERSONAJES.forEach(loadFace);
  let chosen=null;
  selectScreen();

  function selectScreen(){
    if(cleanup){ cleanup(); cleanup=null; }
    el.innerHTML=`<h2>🥊 Boxeo</h2><p class="lead">Elegí tu personaje y ganá los 5 rounds.</p><div class="box-pick" id="boxPick"></div>`;
    const grid=el.querySelector('#boxPick');
    grid.innerHTML=BOX_PERSONAJES.map(p=>`
      <div class="box-card" data-id="${p.id}">
        <div class="box-face"><div class="box-ph">${p.emoji}</div></div></div>
        <div class="box-nm">${p.nombre}</div></div>`).join('');
    grid.querySelectorAll('.box-card').forEach(c=>c.onclick=()=>startFight(c.dataset.id,1));
  }

  function startFight(id, level){
    if(cleanup){ cleanup(); cleanup=null; }
    chosen=id;
    const cfg=BOX_LEVELS[level-1];
    const others=BOX_PERSONAJES.filter(p=>p.id!==id);
    const opp=others[(level-1)%others.length];
    const me=BOX_PERSONAJES.find(p=>p.id===id);
    const meFace=loadFace(me), oppFace=loadFace(opp);

    el.innerHTML=`<h2>🥊 Boxeo</h2>
      <div class="hud"><span class="lv">Round ${level}/5</span><span>${me.nombre} vs ${opp.nombre}</span></div>
      <canvas id="boxCanvas" width="300" height="340"></canvas>
      <div class="lr" style="margin-top:12px"><button class="btn" id="bxL">◀</button><button class="btn" id="bxU">▲</button><button class="btn" id="bxD">▼</button><button class="btn" id="bxR">▶</button></div>
      <div class="lr" style="margin-top:8px"><button class="btn danger" id="bxP">🥊 Golpe</button><button class="btn alt" id="bxB">🛡️ Bloqueo</button></div>
      <div class="banner" id="bxBanner"></div>`;
    const cv=el.querySelector('#boxCanvas'), ctx=cv.getContext('2d'); const W=cv.width,H=cv.height;

    // z = profundidad (0 = fondo del ring, 1 = frente). Sirve para esquivar.
    let pHP=cfg.hp, oHP=cfg.hp, px=95, ox=210, pz=0.5, oz=0.5;
    let moveL=false, moveR=false, moveU=false, moveD=false, blocking=false;
    let pPunch=0, pCd=0, pHurt=0, oHurt=0, oBlock=0, over=false, raf, last=performance.now(), pow=null;
    let oState='idle', oT=cfg.intv, oPunch=0, oTargetZ=0.5;

    const floorY = z => 250 + z*58;                 // más z = más cerca = más abajo
    const scaleOf = z => 0.80 + z*0.28;             // más cerca = más grande

    function frame(now){
      const dt=Math.min(50, now-last); last=now;
      if(!over){
        if(moveL) px-=2.6; if(moveR) px+=2.6; px=Math.max(40,Math.min(165,px));
        if(moveU) pz-=0.022; if(moveD) pz+=0.022; pz=Math.max(0,Math.min(1,pz));
        if(pCd>0) pCd-=dt; if(pPunch>0) pPunch-=dt; if(pHurt>0) pHurt-=dt; if(oHurt>0) oHurt-=dt; if(oBlock>0) oBlock-=dt;

        oT-=dt;
        const dist=ox-px, dz=Math.abs(oz-pz);

        if(oState==='idle'){
          if(dist>96) ox-=cfg.spd*(dt/16.7); else if(dist<70) ox+=cfg.spd*(dt/16.7);
          ox=Math.max(125,Math.min(262,ox));
          // sigue al jugador en profundidad, con algo de retraso
          if(Math.abs(oz-oTargetZ)<0.04) oTargetZ = pz + (Math.random()-0.5)*0.35;
          oTargetZ=Math.max(0,Math.min(1,oTargetZ));
          oz += Math.sign(oTargetZ-oz)*Math.min(0.012, Math.abs(oTargetZ-oz));
          if(oT<=0){ oState='windup'; oT=420; }
        } else if(oState==='windup'){
          if(oT<=0){
            oState='punch'; oPunch=220;
            const alcanza = (ox-px)<98 && Math.abs(oz-pz)<0.28;   // hay que estar alineado en profundidad
            if(alcanza){
              if(blocking){ pow={x:(px+ox)/2,y:floorY(pz)-96,t:300,txt:'BLOCK'}; }
              else { pHP-=cfg.dmg; pHurt=260; pow={x:(px+ox)/2,y:floorY(pz)-96,t:320,txt:'¡AY!'}; if(pHP<=0){ pHP=0; lose(); } }
            } else { pow={x:(px+ox)/2,y:floorY(pz)-96,t:280,txt:'¡FALLÓ!'}; }
          }
        } else if(oState==='punch'){
          oPunch-=dt; if(oPunch<=0){ oState='idle'; oT=cfg.intv; }
        }
        if(pow){ pow.t-=dt; if(pow.t<=0) pow=null; }
      }
      draw(); raf=requestAnimationFrame(frame);
    }

    function punch(){
      if(over||pCd>0||blocking) return;
      pPunch=220; pCd=330;
      const alcanza = (ox-px)<98 && Math.abs(oz-pz)<0.28;
      if(!alcanza){ pow={x:(px+ox)/2,y:floorY(pz)-96,t:260,txt:'AIRE'}; return; }
      // el rival puede cubrirse o contraatacar
      if(Math.random()<cfg.block){
        oBlock=320; pow={x:(px+ox)/2,y:floorY(oz)-96,t:300,txt:'CUBRE'};
        if(Math.random()<cfg.ret && !blocking){                       // contragolpe
          setTimeout(()=>{ if(over)return; pHP-=Math.round(cfg.dmg*0.7); pHurt=240;
            pow={x:(px+ox)/2,y:floorY(pz)-96,t:300,txt:'¡CONTRA!'}; if(pHP<=0){ pHP=0; lose(); } },300);
        }
      } else {
        oHP-=11; oHurt=240; ox=Math.min(262,ox+9);
        pow={x:(px+ox)/2,y:floorY(oz)-96,t:320,txt:'¡POW!'};
        if(oHP<=0){ oHP=0; win(); }
      }
    }
    function win(){ over=true; awardLevel('boxeo', level); Fiesta.guardarPuntaje('boxeo', level*100, level); burst(); const bn=el.querySelector('#bxBanner');
      if(level<5){ bn.innerHTML=`¡Ganaste el round ${level}! ⭐`; const b=document.createElement('button'); b.className='btn mt'; b.textContent='Siguiente round ▶'; b.onclick=()=>startFight(chosen,level+1); bn.appendChild(document.createElement('br')); bn.appendChild(b); }
      else bn.innerHTML=`🏆 ¡Campeón del Boxeo! 5 ⭐`; }
    function lose(){ over=true; const bn=el.querySelector('#bxBanner'); bn.innerHTML=`<span style="color:var(--magenta)">¡Te noquearon! 🥴</span>`;
      const b=document.createElement('button'); b.className='btn alt mt'; b.textContent='Reintentar round'; b.onclick=()=>startFight(chosen,level); bn.appendChild(document.createElement('br')); bn.appendChild(b); }

    function hpBar(x,w,hp,max,color){ ctx.fillStyle='#0a0416'; rr(ctx,x,12,w,13,6); ctx.fill(); ctx.fillStyle=color; rr(ctx,x,12,Math.max(0,w*hp/max),13,6); ctx.fill(); }

    function drawBoxer(cx, z, face, facing, punchExt, hurt, trunk, guard){
      const s=scaleOf(z), y=floorY(z), bob=Math.sin(Date.now()/200)*2*s;
      const lean = hurt>0 ? -facing*7*s : 0;
      ctx.save(); ctx.translate(cx+lean, y); ctx.scale(s,s);
      // sombra
      ctx.fillStyle='rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0,2,26,7,0,0,7); ctx.fill();
      // piernas + botas
      ctx.fillStyle='#2b1f47'; rr(ctx,-14,-46,11,46,4); ctx.fill(); rr(ctx,3,-46,11,46,4); ctx.fill();
      ctx.fillStyle='#f0f0f5'; rr(ctx,-15,-9,13,9,3); ctx.fill(); rr(ctx,2,-9,13,9,3); ctx.fill();
      // brazo trasero
      ctx.strokeStyle='#e8b48a'; ctx.lineWidth=9; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(0,-84); ctx.lineTo(-facing*14,-62); ctx.stroke();
      ctx.fillStyle='#a3162c'; ctx.beginPath(); ctx.arc(-facing*14,-62,9,0,7); ctx.fill();
      // short
      ctx.fillStyle=trunk; rr(ctx,-19,-92,38,48,11); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.35)'; rr(ctx,-19,-70,38,5,2); ctx.fill();   // elástico
      // torso
      ctx.fillStyle='#e8b48a'; rr(ctx,-17,-104,34,26,10); ctx.fill();
      ctx.fillStyle='rgba(0,0,0,.10)'; rr(ctx,-11,-101,6,18,3); ctx.fill(); rr(ctx,5,-101,6,18,3); ctx.fill();  // pectorales
      // cuello
      ctx.fillStyle='#dda87e'; rr(ctx,-6,-112,12,10,4); ctx.fill();
      // cabeza (cara del personaje)
      const hy=-112-bob;
      if(face && face.ok){ const nat=face.img.naturalWidth/(face.img.naturalHeight||1); const hh=64, ww=Math.max(46,Math.min(78,hh*nat));
        ctx.drawImage(face.img, -ww/2, hy-hh, ww, hh); }
      else { ctx.font='48px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(face&&face.emoji?face.emoji:'🙂', 0, hy-26); }
      // brazo delantero: guardia o golpe
      if(guard){
        ctx.strokeStyle='#e8b48a'; ctx.lineWidth=9;
        ctx.beginPath(); ctx.moveTo(0,-84); ctx.lineTo(facing*13,-92); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0,-72); ctx.lineTo(facing*13,-70); ctx.stroke();
        ctx.fillStyle='#e21e3a'; ctx.beginPath(); ctx.arc(facing*13,-98,11,0,7); ctx.fill();
        ctx.beginPath(); ctx.arc(facing*13,-74,11,0,7); ctx.fill();
      } else {
        const reach=facing*(19+Math.max(0,punchExt)*50);
        ctx.strokeStyle='#e8b48a'; ctx.lineWidth=10; ctx.beginPath(); ctx.moveTo(0,-82); ctx.lineTo(reach,-70); ctx.stroke();
        ctx.fillStyle='#e21e3a'; ctx.beginPath(); ctx.arc(reach,-70,11,0,7); ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.25)'; ctx.beginPath(); ctx.arc(reach-3,-73,4,0,7); ctx.fill();
      }
      ctx.restore();
    }

    function draw(){
      // ring
      ctx.fillStyle='#101c33'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#1b2c4d'; ctx.beginPath(); ctx.moveTo(20,238); ctx.lineTo(W-20,238); ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#16233d'; ctx.fillRect(0,232,W,8);
      // cuerdas del fondo
      ['#ff2e9a','#ffe14d','#26e8ff'].forEach((c,i)=>{ ctx.strokeStyle=c; ctx.lineWidth=3; ctx.globalAlpha=.55;
        ctx.beginPath(); ctx.moveTo(0,120+i*38); ctx.lineTo(W,120+i*38); ctx.stroke(); ctx.globalAlpha=1; });
      // postes
      ctx.fillStyle='#3a2a5a'; ctx.fillRect(14,110,10,132); ctx.fillRect(W-24,110,10,132);
      // barras de vida
      hpBar(10,120,pHP,cfg.hp,'#8cff5a'); hpBar(W-130,120,oHP,cfg.hp,'#ff2e9a');
      // dibujar el de atrás primero (menor z)
      const meG=blocking, opG=(oBlock>0)||oState==='windup';
      const drawMe=()=>drawBoxer(px,pz,meFace,1,pPunch>0?1:0,pHurt,me.trunk,meG);
      const drawOp=()=>drawBoxer(ox,oz,oppFace,-1,oState==='punch'?1:0,oHurt,opp.trunk,opG);
      if(pz<=oz){ drawMe(); drawOp(); } else { drawOp(); drawMe(); }
      if(oState==='windup'){ ctx.fillStyle='#ffe14d'; ctx.font='700 22px "Baloo 2",serif'; ctx.textAlign='center'; ctx.fillText('¡!', ox, floorY(oz)-172); }
      if(pow){ ctx.font='700 24px "Baloo 2",serif'; ctx.textAlign='center';
        ctx.fillStyle = pow.txt==='¡POW!'?'#ffe14d' : pow.txt==='BLOCK'?'#26e8ff' : pow.txt==='CUBRE'?'#c9a9e8' : pow.txt==='¡CONTRA!'?'#ff2e9a' : '#8aa0c8';
        ctx.fillText(pow.txt,pow.x,pow.y); }
    }

    const bind=(id,set)=>{ const b=el.querySelector(id); b.addEventListener('contextmenu',e=>e.preventDefault()); b.addEventListener('pointerdown',e=>{e.preventDefault();set(true);}); ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>set(false))); };
    bind('#bxL',v=>moveL=v); bind('#bxR',v=>moveR=v); bind('#bxU',v=>moveU=v); bind('#bxD',v=>moveD=v); bind('#bxB',v=>blocking=v);
    el.querySelector('#bxP').addEventListener('pointerdown',e=>{e.preventDefault();punch();});
    function kd(e){ if(e.key==='ArrowLeft'||e.key==='a')moveL=true; if(e.key==='ArrowRight'||e.key==='d')moveR=true;
      if(e.key==='ArrowUp'||e.key==='w'){e.preventDefault();moveU=true;} if(e.key==='ArrowDown'||e.key==='s'){e.preventDefault();moveD=true;}
      if(e.key==='Shift')blocking=true; if(e.key===' '){e.preventDefault();punch();} }
    function ku(e){ if(e.key==='ArrowLeft'||e.key==='a')moveL=false; if(e.key==='ArrowRight'||e.key==='d')moveR=false;
      if(e.key==='ArrowUp'||e.key==='w')moveU=false; if(e.key==='ArrowDown'||e.key==='s')moveD=false; if(e.key==='Shift')blocking=false; }
    document.addEventListener('keydown',kd); document.addEventListener('keyup',ku);
    raf=requestAnimationFrame(frame);
    cleanup=()=>{ if(raf) cancelAnimationFrame(raf); document.removeEventListener('keydown',kd); document.removeEventListener('keyup',ku); };
  }
}

/* ============================================================
   TA-TE-TI
   ============================================================ */
function Tateti(el){
  const P='🦁', C='⭕'; let b=Array(9).fill(''), over=false;
  el.innerHTML=`<h2>⭕ Ta-Te-Ti</h2><p class="lead">Vos sos 🦁, la compu es ⭕.</p>
    <div class="ttt-grid" id="tGrid"></div><p class="center" id="tMsg" style="font-weight:800;min-height:26px"></p>
    <div class="center"><button class="btn alt" id="tReset">Jugar de nuevo</button></div>`;
  const grid=el.querySelector('#tGrid'), msg=el.querySelector('#tMsg');
  b.forEach((_,i)=>{ const c=document.createElement('div'); c.className='ttt-cell'; c.onclick=()=>play(i); grid.appendChild(c); });
  el.querySelector('#tReset').onclick=()=>Tateti(el);
  const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  function winner(bd){ for(const[a,c,d]of LINES) if(bd[a]&&bd[a]===bd[c]&&bd[a]===bd[d]) return bd[a]; return null; }
  function render(){ grid.childNodes.forEach((c,i)=>c.textContent=b[i]); }
  function play(i){ if(over||b[i])return; b[i]=P; render(); if(check())return; const m=cpu(); if(m>-1){ b[m]=C; render(); check(); } }
  function check(){ const w=winner(b);
    if(w){ over=true; if(w===P){ msg.innerHTML='<span style="color:var(--lime)">¡Ganaste! 🎉</span>'; Scores.data.tttW++; Scores.save(); checkPremios(); burst(); }
      else{ msg.innerHTML='<span style="color:var(--magenta)">Ganó la compu 🤖</span>'; Scores.data.tttL++; Scores.save(); } return true; }
    if(b.every(x=>x)){ over=true; msg.textContent='¡Empate! 🤝'; Scores.data.tttD++; Scores.save(); return true; } return false; }
  function cpu(){ const find=w=>{ for(const[a,c,d]of LINES){ const l=[b[a],b[c],b[d]]; if(l.filter(x=>x===w).length===2&&l.includes('')) return [a,c,d][l.indexOf('')]; } return -1; };
    let m=find(C); if(m>-1)return m; m=find(P); if(m>-1)return m; if(!b[4])return 4;
    const cor=[0,2,6,8].filter(i=>!b[i]); if(cor.length)return cor[(Math.random()*cor.length)|0];
    const fr=b.map((x,i)=>x?-1:i).filter(i=>i>-1); return fr.length?fr[(Math.random()*fr.length)|0]:-1; }
  render();
}

/* ============================================================
   TRIVIA
   ============================================================ */
function Trivia(el){
  let i=0, score=0, locked=false, aciertosNivel=0;
  const TOTAL=PREGUNTAS.length, PORNIVEL=2;               // 10 preguntas = 5 niveles
  el.innerHTML=`<h2>❓ Trivia de León</h2>
    <div class="hud"><span class="lv" id="qLv">Nivel 1/5</span><span>Pregunta <span class="stat" id="qNum">1</span>/${TOTAL}</span><span>✔ <span class="stat" id="qScore">0</span></span></div>
    <div class="tri-q" id="qText"></div><div class="tri-opts" id="qOpts"></div>
    <div class="banner" id="qBanner"></div><div class="center mt" id="qEnd"></div>`;
  const qText=el.querySelector('#qText'), qOpts=el.querySelector('#qOpts'), banner=el.querySelector('#qBanner');
  function nivelDe(idx){ return Math.min(5, Math.floor(idx/PORNIVEL)+1); }
  function show(){
    locked=false; const p=PREGUNTAS[i];
    el.querySelector('#qNum').textContent=i+1;
    el.querySelector('#qLv').textContent='Nivel '+nivelDe(i)+'/5';
    qText.textContent=p.q; qOpts.innerHTML=''; banner.textContent=''; el.querySelector('#qEnd').innerHTML='';
    p.o.forEach((opt,idx)=>{ const b=document.createElement('button'); b.className='tri-opt'; b.textContent=opt; b.onclick=()=>ans(b,idx,p.ok); qOpts.appendChild(b); });
  }
  function ans(btn,idx,ok){
    if(locked)return; locked=true;
    const nodes=qOpts.querySelectorAll('.tri-opt');
    nodes[ok].classList.add('ok');
    const acerto=(idx===ok);
    if(acerto){ score++; aciertosNivel++; el.querySelector('#qScore').textContent=score; }
    else btn.classList.add('no');
    const eraFinDeNivel=((i+1)%PORNIVEL===0);
    setTimeout(()=>{
      if(eraFinDeNivel){
        const nivel=nivelDe(i);
        if(aciertosNivel===PORNIVEL){          // SOLO sube si acertó las 2
          awardLevel('trivia', nivel); Fiesta.guardarPuntaje('trivia', score*50, nivel); burst();
          if(score>(Scores.data.triviaBest||0)){ Scores.data.triviaBest=score; Scores.save(); }
          i++; aciertosNivel=0;
          if(i<TOTAL){
            qText.textContent=''; qOpts.innerHTML='';
            banner.innerHTML=`¡Nivel ${nivel} superado! ⭐`;
            const b=document.createElement('button'); b.className='btn mt'; b.textContent='Nivel '+(nivel+1)+' ▶';
            b.onclick=show; banner.appendChild(document.createElement('br')); banner.appendChild(b);
          } else end();
        } else {                                // falló: repite el nivel
          if(score>(Scores.data.triviaBest||0)){ Scores.data.triviaBest=score; Scores.save(); }
          const desde=(nivel-1)*PORNIVEL;
          qText.textContent=''; qOpts.innerHTML='';
          banner.innerHTML=`<span style="color:var(--magenta)">Te faltó alguna... ¡probá de nuevo!</span>`;
          const b=document.createElement('button'); b.className='btn alt mt'; b.textContent='Repetir nivel '+nivel;
          b.onclick=()=>{ i=desde; aciertosNivel=0; score-=0; show(); };
          banner.appendChild(document.createElement('br')); banner.appendChild(b);
        }
      } else { i++; show(); }
    },900);
  }
  function end(){
    if(score>(Scores.data.triviaBest||0)){ Scores.data.triviaBest=score; Scores.save(); }
    checkPremios(); qText.textContent=''; qOpts.innerHTML=''; banner.textContent='';
    const perfect=score===TOTAL;
    el.querySelector('#qEnd').innerHTML=`<b style="color:var(--lime);font-size:22px">${perfect?'¡PERFECTO! 🏆':'🏆 ¡Completaste la Trivia! 5 ⭐'}</b><br><span class="lead">Acertaste ${score} de ${TOTAL}</span><br><button class="btn mt" onclick="openGame('trivia')">Jugar otra vez</button>`;
    burst();
  }
  show();
}


/* ================================================================
   CONFETTI
   ================================================================ */
const cc=document.getElementById('confetti'), cx=cc.getContext('2d'); let parts=[], anim=null;
function sizeCanvas(){ cc.width=innerWidth; cc.height=innerHeight; } sizeCanvas(); addEventListener('resize',sizeCanvas);
const COLORS=['#ff2e9a','#26e8ff','#b14bff','#ffe14d','#8cff5a'];
function burst(n=120){ if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  for(let k=0;k<n;k++){ parts.push({ x:innerWidth/2, y:innerHeight/3, vx:(Math.random()-0.5)*10, vy:Math.random()*-9-3, g:0.28, s:6+Math.random()*7, r:Math.random()*6, col:COLORS[(Math.random()*COLORS.length)|0], life:120 }); }
  if(!anim) tick(); }
function tick(){ cx.clearRect(0,0,cc.width,cc.height);
  parts.forEach(p=>{ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=0.2; p.life--; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.col; cx.fillRect(-p.s/2,-p.s/2,p.s,p.s); cx.restore(); });
  parts=parts.filter(p=>p.life>0 && p.y<cc.height+40); anim = parts.length ? requestAnimationFrame(tick) : null; }


</script>
